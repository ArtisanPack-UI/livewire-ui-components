name: Accessibility Tests

on:
  push:
    branches: [ main, develop, 'add/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  accessibility-unit-tests:
    name: Accessibility Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Accessibility Tests
        run: ./vendor/bin/pest --filter=Accessibility --colors=always

      - name: Run All Tests with Coverage
        if: matrix.php == '8.2'
        run: ./vendor/bin/pest --coverage --min=80

  accessibility-static-analysis:
    name: Accessibility Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: phpstan

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse tests/Accessibility --level=5

  accessibility-linting:
    name: Accessibility Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

  accessibility-report:
    name: Generate Accessibility Report
    runs-on: ubuntu-latest
    needs: [ accessibility-unit-tests ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: ./vendor/bin/pest --filter=Accessibility --coverage --coverage-html=coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-coverage-report
          path: coverage
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Accessibility tests passed! All components meet WCAG 2.1 Level AA standards.'
            })

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [ accessibility-unit-tests, accessibility-static-analysis ]
    if: failure()

    steps:
      - name: Comment PR with failure
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Accessibility tests failed. Please review the test results and ensure all components meet WCAG 2.1 Level AA standards.\n\nView the [test results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
