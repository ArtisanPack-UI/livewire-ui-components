name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Upload vendor directory
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / FA ${{ matrix.fontawesome }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 removed — the ecosystem deps (artisanpack-ui/hooks,
          # icons, accessibility, core) all now require illuminate/support
          # ^11+, so composer cannot resolve a Laravel 10 test run.
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            fontawesome: '^2.9'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            fontawesome: '^2.9'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            fontawesome: '^2.9'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            fontawesome: '^3.0'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            fontawesome: '^3.0'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            fontawesome: '^3.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            fontawesome: '^3.0'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --dev --no-interaction --no-update
          composer require \
            "owenvoke/blade-fontawesome:${{ matrix.fontawesome }}" \
            --no-interaction --no-update
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Run Unit tests
        env:
          XDEBUG_MODE: off
        run: php vendor/bin/pest tests/Unit --no-coverage

      # `if: always()` so Feature tests still exercise even when the Unit
      # suite has pre-existing failures — otherwise new Feature coverage
      # (e.g. tests/Feature/HooksTest.php) is silently skipped in CI.
      - name: Run Feature tests
        if: always()
        env:
          XDEBUG_MODE: off
        run: php vendor/bin/pest tests/Feature --no-coverage

  coverage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Code Coverage
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Download vendor directory
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Fix vendor permissions
        run: chmod -R +x vendor/bin/

      - name: Run tests with coverage
        run: php vendor/bin/pest --coverage --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
