# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - build
  - test
  - integration
  - browser
  - accessibility
  - performance
  - coverage
  - code-style
  - security
  - release
sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml

build:vendors:
  stage: build
  artifacts:
    untracked: true
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull-push
  image: php:8.2
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl libzip-dev unzip
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - echo "Forcing a clean vendor directory..."
    - rm -rf vendor
    - composer install --no-interaction --prefer-dist --optimize-autoloader

# Unit Tests
unit-tests:
  stage: test
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull
  image: php:8.2
  parallel: 4
  script:
    - ./vendor/bin/pest tests/Unit --ci --coverage --coverage-clover=coverage-unit.xml --parallel
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-unit.xml
    paths:
      - coverage-unit.xml
    expire_in: 1 week
  allow_failure: true  # Allow failures while tests are being refined

# Feature Tests
feature-tests:
  stage: test
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull
  image: php:8.2
  parallel: 2
  script:
    - ./vendor/bin/pest tests/Feature --ci --coverage --coverage-clover=coverage-feature.xml --parallel
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-feature.xml
    paths:
      - coverage-feature.xml
    expire_in: 1 week

# Integration Tests
integration-tests:
  stage: integration
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull
  image: php:8.2
  parallel: 2
  script:
    - ./vendor/bin/pest tests/Integration --ci --coverage --coverage-clover=coverage-integration.xml --parallel
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-integration.xml
    paths:
      - coverage-integration.xml
    expire_in: 1 week

# Browser Tests with Dusk
browser-tests:
  stage: browser
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull
  image: php:8.2
  services:
    - selenium/standalone-chrome:latest
  variables:
    DUSK_DRIVER_URL: "http://selenium-standalone-chrome:4444/wd/hub"
    DUSK_HEADLESS_DISABLED: 0
  script:
    - apt-get update -qq && apt-get install -y -qq git curl libzip-dev unzip
    - ./vendor/bin/pest tests/Browser --ci --coverage --coverage-clover=coverage-browser.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-browser.xml
    paths:
      - coverage-browser.xml
      - tests/Browser/screenshots/
    expire_in: 1 week
    when: always
  allow_failure: true  # Allow failures while tests are being refined

# Accessibility Tests
accessibility-tests:
  stage: accessibility
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull
  image: php:8.2
  services:
    - selenium/standalone-chrome:latest
  variables:
    DUSK_DRIVER_URL: "http://selenium-standalone-chrome:4444/wd/hub"
  script:
    - apt-get update -qq && apt-get install -y -qq git curl libzip-dev unzip nodejs npm
    - npm install -g axe-core @axe-core/cli
    - ./vendor/bin/pest tests/Accessibility --ci
  artifacts:
    paths:
      - accessibility-report.json
    expire_in: 1 week
    when: always
  allow_failure: true  # Allow failures while tests are being refined

# Performance Tests
performance-tests:
  stage: performance
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull
  image: php:8.2
  script:
    - ./vendor/bin/pest tests/Performance --ci
  artifacts:
    paths:
      - performance-report.json
    expire_in: 1 week
    when: always
  allow_failure: true  # Allow failures while tests are being refined

# Test Coverage Analysis
coverage-analysis:
  stage: coverage
  dependencies:
    - unit-tests
    - feature-tests
    - integration-tests
    - browser-tests
  only:
    refs:
      - merge_requests
      - push
  image: php:8.2
  script:
    - apt-get update -qq && apt-get install -y -qq git curl libzip-dev unzip
    - ./vendor/bin/pest --coverage --coverage-html=coverage-html --coverage-clover=coverage-combined.xml --min=95
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-combined.xml
    paths:
      - coverage-html/
      - coverage-combined.xml
    expire_in: 1 week
  allow_failure: true  # Allow failures while coverage threshold is being reached

# Mutation Testing
mutation-tests:
  stage: coverage
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
      prefix: v1
    policy: pull
  image: php:8.2
  script:
    - ./vendor/bin/infection --threads=4 --min-msi=80 --min-covered-msi=90
  artifacts:
    paths:
      - infection.log
    expire_in: 1 week
    when: always
  allow_failure: true

# Static Analysis
static-analysis:
  stage: code-style
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
    policy: pull
  image: php:8.2
  script:
    - ./vendor/bin/phpstan analyse src --level=8 --no-progress
    - ./vendor/bin/rector process --dry-run --no-progress-bar
  allow_failure: true

code-style:
  stage: code-style
  dependencies:
    - build:vendors
  only:
    refs:
      - merge_requests
      - push
  cache:
    key:
      files:
        - composer.lock
    policy: pull
  image: php:8.2
  allow_failure: true
  script:
    - ./vendor/bin/phpcs --standard=ArtisanPackUIStandard src

# Job 1: Prepare the release description from CHANGELOG.md
prepare_release_description:
  stage: release
  image: alpine:latest # Use alpine for grep, sed, and bash
  before_script:
    # Install necessary tools: grep, sed, and bash
    - apk add --no-cache grep sed bash
  rules:
    - if: $CI_COMMIT_TAG # This job will only run when a Git tag is pushed
  script:
    - |
      set -euxo pipefail # Enable debugging flags for debugging

      echo "--- Preparing Release Description ---"
      echo "CI_COMMIT_TAG: ${CI_COMMIT_TAG}"

      # Verify CHANGELOG.md exists in the current working directory
      echo "Listing files in current directory ($(pwd)):"
      ls -la
      if [ ! -f "CHANGELOG.md" ]; then
        echo "Error: CHANGELOG.md not found in the repository root. Cannot extract release description."
        # Provide a default description if CHANGELOG.md is missing.
        # This will be passed to the next job.
        RELEASE_DESCRIPTION_FINAL="Release ${CI_COMMIT_TAG}. No CHANGELOG.md found. Please create one."
      else
        echo "CHANGELOG.md found. Attempting to read content."
        echo "--- Start of CHANGELOG.md Content ---"
        cat CHANGELOG.md
        echo "--- End of CHANGELOG.md Content ---"

        # Extract the version number from the Git tag (e.g., 'v1.2.3' -> '1.2.3')
        RELEASE_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
        echo "Extracted RELEASE_VERSION: ${RELEASE_VERSION}"

        # Define markers for the start and end of the desired section in CHANGELOG.md
        # Assumes CHANGELOG.md headings are like '## [X.Y.Z]'
        START_MARKER="## \\[${RELEASE_VERSION}\\].*"
        END_MARKER="## \\[[^]]*\\].*" # Matches the next version heading
        echo "START_MARKER: ${START_MARKER}"
        echo "END_MARKER: ${END_MARKER}"

        # Extract the block of text for the current release from CHANGELOG.md
        CHANGELOG_CONTENT=$(sed -n "/${START_MARKER}/,/${END_MARKER}/p" CHANGELOG.md)
        echo "Raw CHANGELOG_CONTENT extracted (may be empty if no match):"
        echo "${CHANGELOG_CONTENT}"

        # Clean up the extracted content:
        # Check if CHANGELOG_CONTENT is empty before piping to grep/sed to avoid errors
        if [ -z "${CHANGELOG_CONTENT}" ]; then
          TEMP_DESCRIPTION="" # Set to empty if no content extracted
        else
          TEMP_DESCRIPTION=$(echo "${CHANGELOG_CONTENT}" | \
            grep -v "${START_MARKER}" | \
            grep -v "${END_MARKER}" | \
            grep -v "^# Changelog" | \
            sed -e 's/^[[:space:]]*//' -e '/^$/d')
        fi

        # Fallback description if the specific version isn't found or extraction failed
        if [ -z "${TEMP_DESCRIPTION}" ] || [ "${TEMP_DESCRIPTION}" = " " ]; then
          echo "Warning: Could not find a specific description for tag ${CI_COMMIT_TAG} in CHANGELOG.md or extracted content was empty/whitespace. Using a generic description."
          RELEASE_DESCRIPTION_FINAL="Release ${CI_COMMIT_TAG}. Refer to CHANGELOG.md for detailed changes."
        else
          RELEASE_DESCRIPTION_FINAL="${TEMP_DESCRIPTION}"
        fi
      fi

      echo "--- Final Release Description Content to be Passed ---"
      echo "${RELEASE_DESCRIPTION_FINAL}"
      echo "----------------------------------------------------"

      # Escape newlines in RELEASE_DESCRIPTION_FINAL for the .env file
      # The sed command will convert all newlines into literal '\n' sequences.
      ESCAPED_RELEASE_DESCRIPTION=$(echo "${RELEASE_DESCRIPTION_FINAL}" | sed -E ':a;N;s/\n/\\n/g;ta')

      # Save the final escaped description to a .env file.
      # This file will be picked up by the next job due to 'artifacts:reports:dotenv'.
      echo "RELEASE_DESCRIPTION=${ESCAPED_RELEASE_DESCRIPTION}" > release.env
      echo "Description saved to release.env"
  artifacts:
    reports:
      dotenv: release.env # Export variables from release.env to subsequent jobs

# Job 2: Create the GitLab Release using the extracted description
create_actual_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest # Use the official release-cli image
  needs:
    # Ensure this job runs after 'prepare_release_description' and inherits its dotenv artifacts.
    - job: prepare_release_description
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG # Only run this job if a tag is pushed
  script:
    # Use the literal block scalar for the entire script to avoid YAML parsing issues.
    - |
      set -euxo pipefail # Enable debugging flags for debugging
      echo "--- Creating GitLab Release ---"
      echo "CI_COMMIT_TAG: ${CI_COMMIT_TAG}"
      # The RELEASE_DESCRIPTION variable is automatically loaded from the dotenv artifact of the previous job.
      echo "Received RELEASE_DESCRIPTION: ${RELEASE_DESCRIPTION}"
      # Create the release using release-cli
      release-cli create --name "Release ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" --description "${RELEASE_DESCRIPTION}"
      echo "Release created successfully."
